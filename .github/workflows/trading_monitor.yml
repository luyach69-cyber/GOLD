name: Taiwan Trading Monitor

on:
  # 設定自動定時觸發：週一至週五，台灣時間早上 9:00 到 下午 1:30 之間，每 5 分鐘執行一次
  # GitHub 時間為 UTC，台灣時間 (UTC+8) 09:00-13:30 對應 UTC 01:00-05:30
  schedule:
    - cron: '*/5 1-5 * * 1-5'
  
  # 允許手動從 GitHub 網頁端手動觸發測試
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: |
          python main.py
